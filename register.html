<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — TezTaom</title>
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#FAF7F0] text-[#173B2D] min-h-screen flex flex-col justify-between antialiased">

    <header class="w-full max-w-[1140px] mx-auto px-4 sm:px-6 pt-6 pb-4">
        <div class="flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="./images/teztaom_horizontal_logo.png" alt="TezTaom Logo" class="h-8 sm:h-9 w-auto object-contain transition group-hover:scale-105">
            </a>
            <a href="index.html" class="inline-flex items-center gap-2 text-xs sm:text-sm font-medium text-[#7B7266] hover:text-[#D95A2B] transition">
                <i class="bi bi-arrow-left"></i>
                <span>Bosh sahifaga qaytish</span>
            </a>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl border border-[rgba(31,27,22,0.08)] p-6 sm:p-8 shadow-card">
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-xl bg-[#FAF7F0] border border-[rgba(31,27,22,0.08)] flex items-center justify-center mx-auto mb-3">
                    <img src="./images/teztaom_symbol_tight.png" alt="TezTaom" class="w-7 h-7 object-contain">
                </div>
                <h1 class="text-xl sm:text-2xl font-semibold text-[#1F1B16]">Yangi hisob yaratish</h1>
                <p class="text-xs sm:text-sm text-[#7B7266] mt-1">Tezkor yetkazib berish va chegirmalardan bahramand bo'ling</p>
            </div>

            <div id="registerAlert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

            <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                <div>
                    <label for="regName" class="block text-xs font-medium text-[#5E554A] mb-1.5">Ism va familiya</label>
                    <div class="relative">
                        <i class="bi bi-person absolute left-3.5 top-1/2 -translate-y-1/2 text-[#7B7266] text-xs"></i>
                        <input
                            type="text"
                            id="regName"
                            required
                            placeholder="Masalan: Jasur Rahimov"
                            class="w-full bg-[#FAF7F0] border border-[rgba(31,27,22,0.08)] rounded-lg pl-9 pr-3.5 py-2.5 text-sm text-[#1F1B16] placeholder-[#968E82] focus:outline-none focus:border-[#D95A2B] focus:bg-white transition"
                        >
                    </div>
                </div>

                <div>
                    <label for="regPhone" class="block text-xs font-medium text-[#5E554A] mb-1.5">Telefon raqam</label>
                    <div class="relative">
                        <i class="bi bi-telephone absolute left-3.5 top-1/2 -translate-y-1/2 text-[#7B7266] text-xs"></i>
                        <input
                            type="tel"
                            id="regPhone"
                            required
                            placeholder="+998 (90) 123-45-67"
                            class="w-full bg-[#FAF7F0] border border-[rgba(31,27,22,0.08)] rounded-lg pl-9 pr-3.5 py-2.5 text-sm text-[#1F1B16] placeholder-[#968E82] focus:outline-none focus:border-[#D95A2B] focus:bg-white transition"
                        >
                    </div>
                </div>

                <div>
                    <label for="regPassword" class="block text-xs font-medium text-[#5E554A] mb-1.5">Yangi parol</label>
                    <div class="relative">
                        <i class="bi bi-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-[#7B7266] text-xs"></i>
                        <input
                            type="password"
                            id="regPassword"
                            required
                            minlength="4"
                            placeholder="Kamida 4 ta belgi"
                            class="w-full bg-[#FAF7F0] border border-[rgba(31,27,22,0.08)] rounded-lg pl-9 pr-10 py-2.5 text-sm text-[#1F1B16] placeholder-[#968E82] focus:outline-none focus:border-[#D95A2B] focus:bg-white transition"
                        >
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('regPassword', 'regPasswordToggleIcon')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-[#7B7266] hover:text-[#1F1B16] p-1 text-xs"
                        >
                            <i id="regPasswordToggleIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="regConfirmPassword" class="block text-xs font-medium text-[#5E554A] mb-1.5">Parolni tasdiqlang</label>
                    <div class="relative">
                        <i class="bi bi-shield-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-[#7B7266] text-xs"></i>
                        <input
                            type="password"
                            id="regConfirmPassword"
                            required
                            minlength="4"
                            placeholder="Parolni qayta kiriting"
                            class="w-full bg-[#FAF7F0] border border-[rgba(31,27,22,0.08)] rounded-lg pl-9 pr-10 py-2.5 text-sm text-[#1F1B16] placeholder-[#968E82] focus:outline-none focus:border-[#D95A2B] focus:bg-white transition"
                        >
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('regConfirmPassword', 'regConfirmToggleIcon')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-[#7B7266] hover:text-[#1F1B16] p-1 text-xs"
                        >
                            <i id="regConfirmToggleIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="text-xs pt-1">
                    <label class="flex items-start gap-2.5 cursor-pointer text-[#5E554A]">
                        <input type="checkbox" id="regTerms" required checked class="mt-0.5 rounded border-gray-300 text-[#D95A2B] focus:ring-[#D95A2B]">
                        <span class="leading-relaxed">TezTaom xizmat ko'rsatish shartlari va maxfiylik siyosatiga roziman</span>
                    </label>
                </div>

                <button
                    type="submit"
                    class="w-full btn-primary py-2.5 text-sm font-semibold flex items-center justify-center gap-2 mt-2 shadow-xs cursor-pointer"
                >
                    <span>Ro'yxatdan o'tish</span>
                    <i class="bi bi-arrow-right text-xs"></i>
                </button>
            </form>

            <p class="text-center text-xs text-[#7B7266] mt-6">
                Hisobingiz bormi?
                <a href="login.html" class="text-[#D95A2B] font-semibold hover:underline ml-1">Kirish</a>
            </p>

        </div>
    </main>

    <footer class="w-full max-w-[1140px] mx-auto px-4 py-6 text-center text-xs text-[#7B7266]">
        <p>&copy; 2026 TezTaom. Barcha huquqlar himoyalangan.</p>
    </footer>

    <div id="toastContainer" class="toast-container"></div>

    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function handleRegisterSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const terms = document.getElementById('regTerms').checked;
            const alertBox = document.getElementById('registerAlert');

            if (!name || !phone || !password) {
                alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200 block';
                alertBox.textContent = "Iltimos, barcha maydonlarni to'ldiring.";
                return;
            }

            if (password !== confirmPassword) {
                alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200 block';
                alertBox.textContent = "Kiritilgan parollar bir-biriga mos kelmadi.";
                return;
            }

            if (!terms) {
                alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200 block';
                alertBox.textContent = "Foydalanish shartlariga rozilik bildirishingiz kerak.";
                return;
            }

            let users = [];
            try {
                users = JSON.parse(localStorage.getItem('teztaom_registered_users') || '[]');
            } catch (e) {
                users = [];
            }

            const cleanPhone = phone.replace(/\D/g, '');
            const userExists = users.some(u => (u.phone || '').replace(/\D/g, '') === cleanPhone);

            if (userExists) {
                alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200 block';
                alertBox.textContent = "Ushbu telefon raqami allaqachon ro'yxatdan o'tgan. Iltimos, tizimga kiring.";
                return;
            }

            const nameParts = name.split(' ');
            let initials = 'U';
            if (nameParts.length >= 2) {
                initials = (nameParts[0][0] + nameParts[1][0]).toUpperCase();
            } else if (nameParts.length === 1 && nameParts[0].length > 0) {
                initials = nameParts[0].substring(0, 2).toUpperCase();
            }

            const newUser = {
                name: name,
                phone: phone,
                password: password,
                initials: initials,
                role: "Mijoz",
                ordersCount: 0,
                favsCount: 0,
                registeredAt: new Date().toLocaleDateString('uz-UZ')
            };

            users.push(newUser);
            localStorage.setItem('teztaom_registered_users', JSON.stringify(users));
            localStorage.setItem('teztaom_current_user', JSON.stringify(newUser));

            alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 block';
            alertBox.textContent = "Hisobingiz muvaffaqiyatli yaratildi! Bosh sahifaga yo'naltirilmoqda...";

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        }
    </script>
</body>
</html>
